    <h1><span data-l="en">《古兰经》和圣训中的水</span></h1>
    <p class="intro"><span data-l="en">修建马杰勒、维护饮水泉或指明一处泉水，就是“给人水喝”：按照先知 ﷺ 的教导，这是最好的施舍。经文以阿拉伯文给出，并附有其含义的译文。</span></p>

  <section class="carte coran-page" dir="rtl" lang="ar">
    <h3 class="coran-h3">من القرآن الكريم</h3>
        <figure class="hadith ayat" dir="rtl" lang="ar">
          <div class="hadith-ornament">✦</div>
          <blockquote class="hadith-text">﴿وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَيْءٍ حَيٍّ ۖ أَفَلَا يُؤْمِنُونَ﴾</blockquote>
          <figcaption class="hadith-source">سورة الأنبياء، الآية ٣٠</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">… 我用水创造一切生物。难道他们不信吗？ <small>译解：马坚 (<a href="https://quranenc.com/" rel="noopener">QuranEnc</a>)</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith ayat" dir="rtl" lang="ar">
          <blockquote class="hadith-text">﴿أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ (٦٨) أَأَنتُمْ أَنزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنزِلُونَ (٦٩) لَوْ نَشَاءُ جَعَلْنَاهُ أُجَاجًا فَلَوْلَا تَشْكُرُونَ﴾</blockquote>
          <figcaption class="hadith-source">سورة الواقعة، الآيات ٦٨–٧٠</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">你们告诉吧！你们所饮的水， 究竟是你们使它从云上降下的呢？还是我使它降下的呢？ 假若我意欲，我必使它变成苦的，你们怎么不感谢呢？ <small>译解：马坚 (<a href="https://quranenc.com/" rel="noopener">QuranEnc</a>)</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith ayat" dir="rtl" lang="ar">
          <blockquote class="hadith-text">﴿وَأَنزَلْنَا مِنَ السَّمَاءِ مَاءً طَهُورًا﴾</blockquote>
          <figcaption class="hadith-source">سورة الفرقان، الآية ٤٨</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">… 我从天上降下清洁的雨水， <small>译解：马坚 (<a href="https://quranenc.com/" rel="noopener">QuranEnc</a>)</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith ayat" dir="rtl" lang="ar">
          <blockquote class="hadith-text">﴿قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ﴾</blockquote>
          <figcaption class="hadith-source">سورة الملك، الآية ٣٠</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">你说：“你们告诉我吧，如果你们的水一旦渗漏了，谁能给你们一条流水呢？” <small>译解：马坚 (<a href="https://quranenc.com/" rel="noopener">QuranEnc</a>)</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith ayat" dir="rtl" lang="ar">
          <blockquote class="hadith-text">﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا ۚ إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ﴾</blockquote>
          <figcaption class="hadith-source">سورة الأعراف، الآية ٣١</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">… 你们应当吃，你们应当喝，但不要浪费，安拉确是不喜欢浪费者的。 <small>译解：马坚 (<a href="https://quranenc.com/" rel="noopener">QuranEnc</a>)</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
    
        <h3 class="coran-h3">من الحديث النبوي الشريف ﷺ</h3>
        <figure class="hadith" dir="rtl" lang="ar">
          <div class="hadith-ornament">✦</div>
          <blockquote class="hadith-text">قالَ سعدُ بنُ عُبادةَ رضي الله عنه: يا رسولَ اللهِ، إنَّ أُمِّي ماتت، أفأتصدَّقُ عنها؟ قال: «نعم». قلتُ: فأيُّ الصَّدقةِ أفضلُ؟ قال: «سَقْيُ الماءِ»</blockquote>
          <figcaption class="hadith-source">رواه النسائي (٣٦٦٤)، وحسّنه الألباني</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">赛尔德·本·欧巴达（愿安拉喜悦他）说：“安拉的使者啊，我的母亲去世了，我可以替她施舍吗？”他说：“可以。”我问：“哪种施舍最好？”他说：“给人水喝。” <small>大意译文</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith" dir="rtl" lang="ar">
          <blockquote class="hadith-text">قالَ رسولُ اللهِ ﷺ: «بينما رجلٌ يمشي بطريقٍ اشتدَّ عليه العطشُ، فوجد بئرًا فنزل فيها فشرب ثم خرج، فإذا كلبٌ يلهثُ يأكلُ الثَّرى من العطش، فقال الرجل: لقد بلغ هذا الكلبَ من العطش مثلُ الذي كان بلغ مني، فنزل البئرَ فملأ خُفَّه ماءً ثم أمسكه بفيه حتى رَقِيَ فسقى الكلبَ، فشكر اللهُ له فغفر له». قالوا: يا رسولَ الله، وإنَّ لنا في البهائم لأجرًا؟ فقال: «في كلِّ كَبِدٍ رَطْبةٍ أجرٌ»</blockquote>
          <figcaption class="hadith-source">متفق عليه (البخاري ومسلم)</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">安拉的使者 ﷺ 说：“有一个人在路上行走，感到非常口渴。他找到一口井，下到井里喝了水，然后上来。这时他看见一条狗在喘息，渴得舔食湿土。那人心想：‘这条狗渴得和我刚才一样。’于是他又下到井里，把鞋子灌满水，用嘴衔着鞋爬上来，给狗喝了水。安拉因此嘉许了他，并饶恕了他。”人们问：“安拉的使者啊，我们善待动物也有回赐吗？”他说：“善待一切有生命的东西，都有回赐。” <small>大意译文</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith" dir="rtl" lang="ar">
          <blockquote class="hadith-text">قالَ رسولُ اللهِ ﷺ: «المسلمونَ شركاءُ في ثلاثٍ: في الكلأِ، والماءِ، والنارِ»</blockquote>
          <figcaption class="hadith-source">رواه أبو داود (٣٤٧٧)، وصحّحه الألباني</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">安拉的使者 ﷺ 说：“穆斯林在三样东西上是共有的：牧草、水和火。” <small>大意译文</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
        <figure class="hadith" dir="rtl" lang="ar">
          <blockquote class="hadith-text">عن أنسٍ رضي الله عنه قال: «كانَ رسولُ اللهِ ﷺ يتوضَّأُ بالمُدِّ، ويغتسلُ بالصَّاعِ إلى خمسةِ أمدادٍ»</blockquote>
          <figcaption class="hadith-source">متفق عليه — الاقتصاد في الماء</figcaption>
        <div class="sens">
          
          
          
          
          
          
          
          
          
          
          <p data-t="zh" lang="zh" dir="ltr">艾奈斯（愿安拉喜悦他）说：“安拉的使者 ﷺ 用一‘莫德’水做小净，用一‘沙阿’至五‘莫德’水做大净。”（一莫德：约为双手合捧满满一捧。） <small>大意译文</small></p>
          
          
          
          
          
          
          
          
          
        </div>
        </figure>
