# Points d'eau signalés par les visiteurs (même Google Forms que les prix du site Prix des Eaux) : publiés toutes les 2 h.
# Un tableau illisible ne change rien (anciens points gardés). Commit seulement si un signalement change (ou une fois par semaine : battement de cœur, audit du 10/10/2026).
name: Signalements des points d'eau
on:
  schedule:
    - cron: "5 7-21/2 * * *"     # 8h05 à 22h05, heure de Tunis
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
env:
  TZ: Africa/Tunis
  PYTHONIOENCODING: utf-8
jobs:
  points:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests du robot (rien n'est publié si un test échoue)
        run: |
          python tools/test_points.py
      - name: Lire les signalements et publier
        run: |
          python tools/signalements_points.py
      - name: Enregistrer
        run: |
          git config user.name "robot-points-eau"
          git config user.email "robot-points-eau@users.noreply.github.com"
          git add donnees/points_eau.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Points d'eau mis à jour ($(date +%d/%m/%Y\ %Hh%M))"
          git pull -q --rebase --autostash
          git push
