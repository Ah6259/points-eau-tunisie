# Points d'eau signalés par les visiteurs (même Google Forms que les prix du site Prix des Eaux) : publiés toutes les 2 h.
# Un tableau illisible ne change rien (anciens points gardés) ; il est relu 2 fois (2 puis 4 min) et le robot passe au ROUGE si la
# panne dure plus de 2 jours (règles communes § 17 et § 38, 23/10/2026). En cas d'échec : alerte (issue « alerte-robot »),
# refermée seule au passage suivant réussi (comme Mosquées).
# Commit seulement si un signalement change (ou une fois par semaine : battement de cœur, audit du 10/10/2026).
name: Signalements des points d'eau
on:
  schedule:
    - cron: "5 7-21/2 * * *"     # 8h05 à 22h05, heure de Tunis
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: robot
  cancel-in-progress: false
env:
  TZ: Africa/Tunis
  PYTHONIOENCODING: utf-8
jobs:
  points:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # relectures de la feuille comprises (2 + 4 min, règle § 38)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests du robot (rien n'est publié si un test échoue)
        run: |
          python tools/test_points.py
          python tools/test_signalements_points.py
      - name: Lire les signalements et publier
        id: lecture
        run: |
          set +e
          python tools/signalements_points.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Enregistrer
        run: |
          git config user.name "robot-points-eau"
          git config user.email "robot-points-eau@users.noreply.github.com"
          git add donnees/points_eau.js donnees/signalements_etat.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Points d'eau mis à jour ($(date +%d/%m/%Y\ %Hh%M))"
          git pull -q --rebase --autostash
          git push
      - name: Feuille des signalements illisible depuis plus de 2 jours = robot rouge
        if: steps.lecture.outputs.code != '0'
        run: |
          echo "::error::Feuille des signalements illisible depuis plus de 2 jours (voir l'étape « Lire les signalements et publier »)"
          exit 1
      - name: Alerte refermée si tout va bien
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --label alerte-robot --state open --search "Points d'eau : robot des signalements en échec in:title" --json number -q '.[].number'); do gh issue close "$n" --comment "Réparé : le robot a de nouveau réussi le $(date +%d/%m/%Y)."; done
      - name: Alerte
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create alerte-robot --color B60205 --force >/dev/null 2>&1 || true
          titre="Points d'eau : robot des signalements en échec"
          corps="Le robot des signalements a échoué (feuille Google des signalements illisible depuis plus de 2 jours, ou un test a échoué). La carte garde ses anciens points. Journal : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n=$(gh issue list --label alerte-robot --state open --search "$titre in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Toujours vrai le $(date +%d/%m/%Y). $corps"; else gh issue create --title "$titre" --body "$corps" --label alerte-robot; fi
