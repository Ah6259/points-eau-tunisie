# À chaque modification publiée : tous les tests (+ sabotage volontaire). En cas d'échec, GitHub envoie un e-mail.
name: Tests
# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install --no-save --no-package-lock jsdom
      - name: Fichiers des robots valides (YAML)
        run: |
          pip install pyyaml
          python -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]"
      - name: Pages à jour (construites depuis tools/gabarits)
        run: |
          python tools/construire.py
          git diff --exit-code -- . ':!node_modules'
      - run: node tools/test_site.mjs
      - run: node tools/test_sw.mjs
      - run: node tools/test_avis.mjs
      - run: node tools/test_video.mjs
      - run: python tools/test_points.py
      - run: python tools/test_sabotage.py
